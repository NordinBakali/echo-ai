<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#00060a">
    <title>Echo · wachtwoord wijzigen</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='echo-circle-logo.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="enterprise-page">
    <main class="enterprise-shell">
        <section class="enterprise-card">
            <p class="demo-login-kicker">ECHO · ACCOUNTBEVEILIGING</p>
            <h1>Stel je nieuwe wachtwoord in</h1>
            <p class="panel-note">Je beheerder heeft een tijdelijk wachtwoord verstrekt. Kies nu een persoonlijk wachtwoord van minimaal 12 tekens. Het tijdelijke wachtwoord werkt daarna niet meer.</p>
            {% if fout %}<p class="panel-note" role="alert">{{ fout }}</p>{% endif %}
            <form class="enterprise-question-form" method="post">
                <label for="newPassword">Nieuw wachtwoord</label>
                <input id="newPassword" name="password" type="password" minlength="12" maxlength="256" autocomplete="new-password" required>
                <label for="confirmPassword">Bevestig nieuw wachtwoord</label>
                <input id="confirmPassword" name="confirm_password" type="password" minlength="12" maxlength="256" autocomplete="new-password" required>
                <button class="panel-action" type="submit">Wachtwoord opslaan</button>
            </form>
            <form action="{{ url_for('demo_logout') }}" method="post">
                <button class="panel-action" type="submit">Uitloggen</button>
            </form>
        </section>
    </main>
</body>
</html>
